<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ARIA · Web3 / Chain</title>
<link rel="stylesheet" href="/static/css/aria.css"/>
</head>
<body>
<div class="app" id="app">
  <main class="stage">
    <header class="stage-head">
      <div>
        <h1>Web3 / Chain</h1>
        <p>0x address card — explorers, geo honesty, locus anchor. Chain identity ≠ GPS.</p>
      </div>
      <div class="stage-actions">
        <button class="btn primary" data-quick-eng>Quick start</button>
        <button class="btn" data-open-eng>Custom</button>
      </div>
    </header>
    <div class="stage-body">
      <div class="domain-grid">
        <section class="panel">
          <h2>Run</h2>
          <div class="field">
            <label>Wallet / contract</label>
            <input id="q" type="text" placeholder="0x…"/>
          </div>
          <button class="btn primary" id="btnRun">Run Web3</button>
          <p class="muted" style="margin-top:1rem;font-size:13px;line-height:1.5" id="activeLabel">Checking engagement…</p>
        </section>
        <section class="panel domain-results">
          <h2>Chain report</h2>
          <div id="out" class="muted">Returns: address, explorer links, honest geo placement status.</div>
        </section>
      </div>
      <section class="panel" id="history"></section>
    </div>
  </main>
</div>
<script src="/static/js/shell.js"></script>
<script src="/static/js/gps.js"></script>
<script src="/static/js/results.js"></script>
<script src="/static/js/domain.js"></script>
<script>ARIADomain.boot("web3", { nav: "web3" });</script>
</body>
</html>
